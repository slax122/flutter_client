name:build-ipa

on:
workflow_dispatch:

jobs:
build_ios:
name:BuildFluxeriOSIPA
runs-on:Xcode-26

steps:
-name:Checkoutcode
uses:actions/checkout@v4
with:
submodules:recursive

-name:SelectXcode26
run:|
XCODE_PATH=$(find/Applications-maxdepth1-name'Xcode_26*.app'|sort-V|tail-n1)
if[-z"$XCODE_PATH"];then
echo"Xcode26notfound"
exit1
fi
sudoxcode-select-s"$XCODE_PATH/Contents/Developer"
xcodebuild-version

-name:SetupFlutterSDK
uses:subosito/flutter-action@v2
with:
channel:stable
cache:true

-name:Enablenativeassets
run:flutterconfig--enable-native-assets

-name:Generateprojectfiles
run:dartrunbuild_runnerbuild

-name:ConfigureiOSbuild
run:darttool/configure_build.dart--profile=ios-store

-name:Installdependencies
run:|
flutterpubget
cdios
podinstall

-name:BuildunsignediOSapp
run:|
flutterbuildios\
--release\
--no-codesign\
--flavorcanary\
--dart-define-from-file=tool/dart_defines/canary.json\
--dart-define=PUSH_PROVIDER=apns

-name:PackageIPA
run:|
mkdir-pbuild/ios/iphoneos/Payload
cp-Rbuild/ios/iphoneos/Runner.appbuild/ios/iphoneos/Payload/
cdbuild/ios/iphoneos
zip-qrFluxer.ipaPayload
test-fFluxer.ipa

-name:UploadIPAartifact
uses:actions/upload-artifact@v4
with:
name:Fluxer-Unsigned-IPA
path:build/ios/iphoneos/Fluxer.ipa
if-no-files-found:error
retention-days:7

###Whatchanged?

-**Runner:**Uses`macos-26`,whichsupportsXcode26.
-**Submodules:**Checksouttherepository'ssubmodules.
-**Buildsetup:**Includestheproject'sdocumentedassetgenerationandiOSconfigurationsteps.
-**Signing:**Uses`--no-codesign`,soAppledistributioncertificatesaren'trequiredforcompilation.
-**Output:**Packages`Runner.app`into`Fluxer.ipa`.
-**NoTestFlightupload:**Theworkflowdoesn'tuploadanythingtoTestFlightortheAppStore.

###HowtodownloadyourIPA

1.CommittheupdatedYAMLfiletoyour`canary`branch.
2.Open[yourBuildIPAworkflow](https://github.com/slax122/flutter_client/actions/workflows/build-ipa.yml).
3.Tap**Runworkflow**.
4.Waitfortheruntofinishsuccessfully.
5.Openthecompletedrunandscrollto**Artifacts**.
6.Download`Fluxer-Unsigned-IPA`.

**Onecaveat:**Thisisaproposedworkflow,notaverifiedsuccessfulbuild.Fluxer'scustomconfiguration,Flutterdependencies,oriOSprojectsettingsmayrequireadjustments.AnunsignedIPAalsoisn'tautomaticallyinstallableonaniPhone;installationrequiresacompatiblesigningmethod.
