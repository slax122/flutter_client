name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build whenever you want

jobs:
  build_ios:
    name: Build Fluxer iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install

      - name: Build Project Assets
        run: flutter build ios --release --no-codesign

      - name: Package Into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Fluxer.zip Payload
          mv Fluxer.zip Fluxer.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer-Unsigned-IPA
          path: build/ios/iphoneos/Fluxer.ipa
